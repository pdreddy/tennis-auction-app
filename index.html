    <style>
        /* ── Design tokens ── */
        :root {
            --neon:     #00f5c4;   /* electric teal — live dot, accents    */
            --gold:     #ffd84d;   /* bright gold — captain/tied/pinned    */
            --blue:     #5b9fff;   /* vivid blue — action buttons          */
            --blue2:    #3d7fe0;
            --purple:   #a78bfa;   /* purple — bid status text             */
            --danger:   #ff4d6a;
            --win:      #00e87a;   /* bright green — winning ONLY          */
            --bg:       #080b14;
            --bg2:      #0d1120;
            --card:     #111827;
            --card-hi:  #161f30;
            --border:   #1e2d45;
            --border-hi:#2a3f60;
            --text:     #eaf1ff;
            --muted:    #6c82a8;
            --muted2:   #3a4f70;
        }

        @keyframes pulse-green { 0%,100%{box-shadow:0 0 6px var(--win)} 50%{box-shadow:0 0 18px var(--win),0 0 32px rgba(0,232,122,.4)} }
        @keyframes shimmer { 0%{background-position:200% center} 100%{background-position:-200% center} }
        @keyframes progress-glow { 0%,100%{box-shadow:0 0 6px rgba(91,159,255,.5)} 50%{box-shadow:0 0 14px rgba(91,159,255,.9),0 0 28px rgba(0,245,196,.4)} }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: rgba(91,159,255,0.15); }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 10px;
            padding-top: max(10px, env(safe-area-inset-top));
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--bg); color: var(--text); min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 10% 0%,   rgba(91,159,255,.12) 0%, transparent 45%),
                radial-gradient(ellipse at 90% 0%,   rgba(167,139,250,.08) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 100%, rgba(0,245,196,.06)  0%, transparent 50%);
        }

        /* ── Login ── */
        .login-wrap {
            max-width: 420px; margin: 60px auto; padding: 36px 30px;
            background: linear-gradient(160deg, #141e33, #0f1828);
            border: 1px solid var(--border-hi); border-radius: 20px;
            box-shadow: 0 0 0 1px rgba(91,159,255,.1), 0 30px 70px rgba(0,0,0,.8),
                        inset 0 1px 0 rgba(255,255,255,.05);
        }
        .login-title {
            font-size: 32px; font-weight: 900; letter-spacing: 1.5px; text-align: center; margin: 0 0 6px;
            background: linear-gradient(135deg, #fff 20%, #a0c4ff 55%, var(--neon) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: shimmer 4s linear infinite;
        }
        .login-sub { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 30px; letter-spacing: .3px; }
        .field-label { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
        .field-wrap { margin-bottom: 18px; }
        select, input[type="password"], input[type="text"], input[type="number"] {
            width: 100%; padding: 13px 15px; font-size: 16px; border-radius: 11px;
            border: 1px solid var(--border); background: rgba(8,11,20,.8); color: var(--text);
            outline: none; appearance: none; -webkit-appearance: none;
            transition: border-color .2s, box-shadow .2s;
        }
        select:focus, input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(91,159,255,.22), 0 0 16px rgba(91,159,255,.15);
        }

        /* ── Buttons ── */
        .btn {
            width: 100%; padding: 14px; font-size: 15px; font-weight: 800;
            border: none; border-radius: 11px; cursor: pointer;
            transition: transform .12s, box-shadow .2s;
            letter-spacing: .4px;
        }
        .btn:active { transform: scale(.96); }
        .btn-primary {
            background: linear-gradient(135deg, #5b9fff, #3d7fe0, #2860c0);
            color: #fff;
            box-shadow: 0 4px 20px rgba(91,159,255,.45), 0 1px 0 rgba(255,255,255,.15) inset;
        }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 30px rgba(91,159,255,.65); transform: translateY(-1px); }
        .btn-success {
            background: linear-gradient(135deg, #00e87a, #00b85e, #009048);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,232,122,.5), 0 1px 0 rgba(255,255,255,.15) inset;
        }
        .btn-success:hover:not(:disabled) { box-shadow: 0 6px 30px rgba(0,232,122,.7); transform: translateY(-1px); }
        .btn-danger {
            background: linear-gradient(135deg, #ff4d6a, #e0253f);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255,77,106,.45);
        }
        .btn-warning { background: linear-gradient(135deg, var(--gold), #e6b800); color: #1a1000; font-weight: 800; }
        .btn-neutral {
            background: var(--card-hi); color: var(--text);
            border: 1px solid var(--border-hi);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
        }
        .btn-neutral:hover:not(:disabled) { background: var(--border); border-color: #3a5580; }
        .btn:disabled { opacity: .3; cursor: default; transform: none !important; box-shadow: none !important; }
        .login-error { color: #ff8099; font-size: 13px; margin-top: 10px; text-align: center; font-weight: 700; }

        /* ── Setup / lobby ── */
        .setup-wrap { max-width: 480px; margin: 40px auto; }
        .card {
            background: linear-gradient(160deg, var(--card-hi), var(--card));
            border: 1px solid var(--border-hi); border-radius: 16px;
            padding: 20px; margin-bottom: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
        }
        .card-title { font-size: 17px; font-weight: 800; margin: 0 0 8px; color: #fff; }
        .card-sub { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.6; }
        .or-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
        .or-row .line { flex:1; height:1px; background: var(--border); }
        .or-row span { font-size: 10px; font-weight: 700; color: var(--muted2); letter-spacing: 1.5px; }
        .code-input { font-size: 28px; font-weight: 900; letter-spacing: 10px; text-align: center; }
        .health-panel { font-size: 12px; color: var(--muted); margin-top: 14px; }
        .health-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); }
        .health-ok  { color: var(--win); font-weight: 800; }
        .health-bad { color: var(--danger); font-weight: 800; }

        /* ── Auction top bar ── */
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
        .top-bar h1 {
            font-size: 20px; font-weight: 900; margin: 0; letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #a0c4ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .sync-dot {
            display: flex; align-items: center; gap: 6px;
            background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 20px;
            padding: 6px 12px; font-size: 11px; color: var(--muted); font-weight: 600;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; }
        .dot-green { background: var(--neon); animation: pulse-green 2s ease-in-out infinite; }
        .dot-red   { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        /* ── Sticky player bar ── */
        .sticky-bar {
            position: sticky; top: 0; z-index: 900;
            background: linear-gradient(135deg, #0e1a35, #131f40, #0e1a35);
            border: 2px solid rgba(91,159,255,.5);
            border-radius: 14px; padding: 12px 16px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            box-shadow: 0 2px 0 rgba(255,255,255,.04) inset,
                        0 6px 30px rgba(91,159,255,.2), 0 12px 40px rgba(0,0,0,.6);
        }
        .sb-player { font-size: 17px; font-weight: 900; color: #fff; }
        .sb-meta   { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .sb-high   { font-size: 13px; color: var(--gold); font-weight: 800; margin-top: 4px; }
        .sb-timer {
            min-width: 66px; text-align: center; padding: 10px 12px; border-radius: 11px;
            background: linear-gradient(135deg, rgba(91,159,255,.2), rgba(91,159,255,.08));
            color: #7bbfff; font-size: 26px; font-weight: 900;
            border: 1px solid rgba(91,159,255,.4);
            box-shadow: 0 0 16px rgba(91,159,255,.25);
        }
        .sb-timer.warn {
            background: linear-gradient(135deg, rgba(255,77,106,.25), rgba(255,77,106,.1));
            color: #ff8099; border-color: rgba(255,77,106,.5);
            box-shadow: 0 0 20px rgba(255,77,106,.35);
        }

        /* ── Progress ── */
        .progress-track { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 0 0 4px; }
        .progress-fill {
            height: 100%; border-radius: 99px; transition: width .4s ease;
            background: linear-gradient(90deg, var(--blue), var(--purple), var(--neon));
            background-size: 200% auto;
            animation: progress-glow 2.5s ease-in-out infinite, shimmer 3s linear infinite;
        }
        .progress-text { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 10px; font-weight: 600; }

        /* ── Admin controls ── */
        .admin-bar { display: flex; gap: 8px; margin-bottom: 10px; }
        .admin-bar .btn { flex: 1; padding: 12px 8px; font-size: 14px; }

        /* ── Bidding grid ── */
        .bidding-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
        @media (min-width: 520px)  { .bidding-grid { grid-template-columns: repeat(2,1fr); } }
        @media (min-width: 800px)  { .bidding-grid { grid-template-columns: repeat(3,1fr); } }
        @media (min-width: 1100px) { .bidding-grid { grid-template-columns: repeat(4,1fr); } }

        .bid-card {
            background: linear-gradient(160deg, var(--card-hi), var(--card));
            border: 1px solid var(--border); border-radius: 14px;
            padding: 12px; display: flex; flex-direction: column; gap: 7px;
            transition: border-color .2s, box-shadow .25s, transform .15s;
            box-shadow: 0 2px 10px rgba(0,0,0,.4);
        }
        .bid-card:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.5); }
        .bid-card.winning {
            border-color: var(--win); border-width: 2px;
            background: linear-gradient(160deg, #082018, #0b2418);
            box-shadow: 0 0 28px rgba(0,232,122,.22), 0 4px 16px rgba(0,0,0,.5);
            animation: pulse-green 2.5s ease-in-out infinite;
        }
        .bid-card.tied {
            border-color: var(--gold); border-width: 2px;
            background: linear-gradient(160deg, #1e1600, #1a1300);
            box-shadow: 0 0 22px rgba(255,216,77,.2), 0 4px 16px rgba(0,0,0,.5);
        }
        .bid-card.pinned { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,216,77,.15); }
        .bid-card.disabled-card {
            display: flex; flex-direction: row; align-items: center;
            justify-content: space-between; opacity: .32; padding: 8px 12px;
        }
        .bid-card-head { display: flex; align-items: flex-start; justify-content: space-between; }
        .team-name { font-size: 14px; font-weight: 800; color: #fff; }
        .team-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
        .pin-btn { background:none; border:none; cursor:pointer; font-size:15px; padding:0 2px; opacity:.25; transition: opacity .15s; }
        .pin-btn.pinned { opacity: 1; }
        .bid-input-wrap { display: flex; flex-direction: column; gap: 5px; }
        .bid-input { font-size: 16px; padding: 9px 10px; border-radius: 9px; }

        /* Quick chips */
        .quick-chips { display: flex; gap: 5px; flex-wrap: wrap; }
        .chip {
            flex: 1 1 auto; min-width: 52px; padding: 7px 4px; text-align: center;
            font-size: 12px; font-weight: 800; border-radius: 8px;
            border: 1px solid rgba(91,159,255,.35);
            background: linear-gradient(135deg, rgba(91,159,255,.14), rgba(91,159,255,.06));
            color: #89bfff; cursor: pointer; touch-action: manipulation;
            transition: all .15s;
        }
        .chip:active { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 0 12px rgba(91,159,255,.5); }
        .chip:hover:not(:disabled) { border-color: rgba(91,159,255,.6); color: #b0d4ff; }
        .chip:disabled { opacity: .18; }

        .place-bid-btn { padding: 11px; font-size: 14px; min-height: 46px; }
        .bid-status { font-size: 11px; color: var(--purple); font-weight: 700; }
        .bid-win-badge {
            background: linear-gradient(135deg, var(--win), #009955);
            color: #fff; font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,232,122,.4);
        }
        .bid-tie-badge {
            background: linear-gradient(135deg, var(--gold), #c89a00);
            color: #1a1000; font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 10px;
        }
        .bid-error { color: #ff8099; font-size: 11px; font-weight: 700; }

        /* ── Pool viewer ── */
        .pool-viewer {
            background: linear-gradient(135deg, #0c1220, #0a1018);
            border: 1px solid var(--border-hi); border-radius: 13px;
            padding: 12px; margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.4);
        }
        .pool-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .pool-chip {
            font-size: 10px; padding: 4px 9px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--card); color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;
            font-weight: 600;
        }
        .pool-chip.active {
            background: linear-gradient(135deg, var(--gold), #d4a800);
            color: #1a1000; font-weight: 800; border-color: var(--gold);
            box-shadow: 0 0 10px rgba(255,216,77,.35);
        }
        .pool-chip.retry  { border-color: var(--danger); color: var(--danger); }

        /* ── Rosters ── */
        .section-toggle {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; background: var(--card-hi); border: 1px solid var(--border-hi);
            color: var(--text); border-radius: 11px; padding: 13px 16px;
            font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 8px;
            transition: all .2s; letter-spacing: .2px;
        }
        .section-toggle:hover { background: var(--border); border-color: #3a5580; }
        .rosters-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 80px; }
        @media (min-width: 640px) { .rosters-grid { grid-template-columns: repeat(3,1fr); } }
        @media (min-width: 900px) { .rosters-grid { grid-template-columns: repeat(4,1fr); } }
        .roster-card {
            background: linear-gradient(160deg, var(--card-hi), var(--card));
            border: 1px solid var(--border); border-radius: 11px;
            padding: 10px; font-size: 11px;
        }
        .roster-name { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 3px; }
        .roster-budget { display: flex; gap: 8px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
        .roster-spent { color: #ff7088; font-weight: 700; }
        .roster-left  { color: var(--win); font-weight: 700; }
        .roster-player  { color: #8a9dc0; margin-top: 2px; }
        .roster-captain { color: var(--gold); font-weight: 800; }

        /* ── Complete screen ── */
        .complete-banner {
            background: linear-gradient(135deg, #062a16, #094020, #062a16);
            border: 2px solid var(--win);
            color: #fff; text-align: center;
            font-size: 22px; font-weight: 900; padding: 20px; border-radius: 14px;
            margin-bottom: 14px;
            box-shadow: 0 0 40px rgba(0,232,122,.3), 0 8px 30px rgba(0,0,0,.5);
            animation: pulse-green 2s ease-in-out infinite;
        }

        /* ── Error banner ── */
        .error-banner {
            background: rgba(255,77,106,.1); border: 1px solid rgba(255,77,106,.4); color: #ff8099;
            border-radius: 11px; padding: 11px 16px; margin-bottom: 10px; font-size: 13px; font-weight: 600;
        }

        /* ── Reset modal ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(5,7,15,.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px; backdrop-filter: blur(8px);
        }
        .modal-card {
            background: linear-gradient(160deg, #161f33, #101828);
            border: 1px solid var(--border-hi); border-radius: 18px;
            padding: 28px; width: 100%; max-width: 360px;
            box-shadow: 0 0 0 1px rgba(91,159,255,.08), 0 30px 70px rgba(0,0,0,.85),
                        inset 0 1px 0 rgba(255,255,255,.05);
        }
        .modal-title { font-size: 20px; font-weight: 800; color: #fff; margin: 0 0 8px; }
        .modal-body  { font-size: 14px; color: var(--muted); line-height: 1.6; margin: 0 0 18px; }
        .modal-btns  { display: flex; gap: 10px; }
        .modal-btns .btn { flex: 1; padding: 13px; }
    </style>
</head>

const CAPTAIN_NAMES = new Set(TEAMS.map(t => t.captain));

const PLAYER_POOLS = {};
POOL_ORDER.forEach(key => {
    const utr = getUTR(key);
    PLAYER_POOLS[key] = PLAYERS.filter(p => p.utr === utr && !CAPTAIN_NAMES.has(p.Name));
});

const POOL_CAPS = {};
POOL_ORDER.forEach(key => {
    const size = PLAYER_POOLS[key].length;
    POOL_CAPS[key] = size === 0 ? 0 : size <= TEAMS.length ? 1 : TEAM_SIZE - 1;
});

// PINs are stored in Firebase at users/<code>/pin — not hardcoded here.

    {code:"ADMIN",label:"Admin · Auctioneer",role:"admin",teamId:null},
    ...TEAMS.map(t => ({code:`TEAM${t.id}`,label:`Team ${t.id} · ${t.captain}`,role:"captain",teamId:t.id}))
];

// ─── Helpers ─────────────────────────────────────────────────────────────────
const fmt = n => (n||0).toLocaleString();
const toArr = v => Array.isArray(v) ? v.filter(x=>x!=null) : (v&&typeof v==="object" ? Object.keys(v).sort((a,b)=>parseInt(a)-parseInt(b)).map(k=>v[k]) : []);
const pref = (k,d) => { try { const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); } catch(e){return d;} };
const savePref = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} };

function normalize(data) {
    if (!data) return null;
    const teams = toArr(data.teams).map(t => ({...t, players: toArr(t.players)}));
    const rawPools = data.playerPools || {};
    const playerPools = {};
    POOL_ORDER.forEach(k => { playerPools[k] = toArr(rawPools[k]); });
    let cb = data.currentBids || {};
    if (Array.isArray(cb)) cb = Object.fromEntries(cb.map((v,i)=>[String(i),v]).filter(([,v])=>v));
    const currentBids = {};
    Object.entries(cb).forEach(([k,v]) => { currentBids[String(k)] = v; });
    return { ...data, teams, playerPools, currentBids,
        currentPoolIndex: data.currentPoolIndex||0,
        currentPlayerIndex: data.currentPlayerIndex||0,
        timerEnd: data.timerEnd || Date.now() };
}

function getEffective(state) {
    const pools = state.playerPools;
    let effPool = state.currentPoolIndex;
    while (effPool < POOL_ORDER.length && (pools[POOL_ORDER[effPool]]||[]).length === 0) effPool++;
    if (effPool >= POOL_ORDER.length) return { complete: true };
    const pool = pools[POOL_ORDER[effPool]] || [];
    const effPlayer = effPool === state.currentPoolIndex
        ? Math.min(state.currentPlayerIndex, Math.max(0, pool.length-1))
        : 0;
    return { complete: false, effPool, effPlayer, poolKey: POOL_ORDER[effPool], pool, player: pool[effPlayer]||null };
}

function getInitialTeams() {
    const byName = Object.fromEntries(PLAYERS.map(p=>[p.Name,p]));
    return TEAMS.map(team => {
        const cap = byName[team.captain];
        const price = cap?.price||0;
        return { ...team, budget: TEAM_BUDGET-price, totalSpent: price,
            players: cap ? [{id:`c${team.id}`,Name:cap.Name,utr:cap.utr,acquiredPrice:price}] : [] };
    });
}

function freshPools() {
    const p = {};
    POOL_ORDER.forEach(k => { p[k] = PLAYER_POOLS[k].map(x=>({...x})); });
    return p;
}

function initialDoc(sid) {
    return { sessionId:sid, teams:getInitialTeams(), playerPools:freshPools(),
        currentPoolIndex:0, currentPlayerIndex:0, currentBids:{},
        timerEnd: Date.now()+TIMER_MS, lastUpdate: Date.now() };
}

function Login({ onLogin }) {
    const [account, setAccount] = useState(ACCOUNTS[0]);
    const [pin, setPin] = useState("");
    const [error, setError] = useState(null);
    const [busy, setBusy] = useState(false);

    const submit = async () => {
        setError(null);
        if (pin.length < 6) { setError("Enter your 6-digit PIN"); return; }
        setBusy(true);
        try {
            const snap = await db.ref(`users/${account.code}`).once("value");
            const user = snap.val();
            if (!user || !user.pin) {
                setError("Account not set up yet. Ask the admin to configure PINs.");
                setBusy(false);
                return;
            }
            if (user.pin !== pin) { setError("Wrong PIN"); setBusy(false); return; }
            onLogin({ code:user.code, role:user.role, teamId:user.teamId, name:account.label });
        } catch(e) { setError("Error: " + e.message); setBusy(false); }
    };

    return (
        <div className="login-wrap">
            <div className="login-title">🎾 TENNIS AUCTION</div>
            <div className="login-sub">Live player draft · Real-time sync</div>

            <div className="field-wrap">
                <div className="field-label">ACCOUNT</div>
                <select value={account.code} onChange={e => setAccount(ACCOUNTS.find(a=>a.code===e.target.value))}>
                    {ACCOUNTS.map(a => <option key={a.code} value={a.code}>{a.label}</option>)}
                </select>
            </div>

            <div className="field-wrap">
                <div className="field-label">6-DIGIT PIN</div>
                <input type="password" value={pin} maxLength={6} inputMode="numeric"
                    placeholder="● ● ● ● ● ●"
                    style={{letterSpacing:8,textAlign:"center",fontSize:20}}
                    onChange={e => setPin(e.target.value.replace(/\D/g,"").slice(0,6))}
                    onKeyPress={e => e.key==="Enter" && submit()} />
            </div>

            {error && <div className="login-error">{error}</div>}

            <button className="btn btn-primary" onClick={submit} disabled={busy || pin.length < 6} style={{marginTop:8}}>
                {busy ? "Signing in…" : "Sign In"}
            </button>
        </div>
    );
}

// ─── Manage PINs (admin only) ─────────────────────────────────────────────────
function ManagePins() {
    const [pins, setPins] = useState({});
    const [saving, setSaving] = useState(null);
    const [msg, setMsg] = useState(null);

    useEffect(() => {
        db.ref("users").once("value").then(snap => {
            const data = snap.val() || {};
            const initial = {};
            ACCOUNTS.forEach(a => { initial[a.code] = (data[a.code] && data[a.code].pin) || ""; });
            setPins(initial);
        });
    }, []);

    const save = async (account) => {
        const pin = pins[account.code] || "";
        if (pin.length !== 6 || !/^\d{6}$/.test(pin)) { setMsg({code:account.code,text:"Must be 6 digits",ok:false}); return; }
        setSaving(account.code);
        await db.ref(`users/${account.code}`).set({
            code: account.code,
            pin,
            role: account.role,
            teamId: account.teamId || null,
            name: account.label
        });
        setSaving(null);
        setMsg({code:account.code,text:"Saved",ok:true});
        setTimeout(() => setMsg(null), 2000);
    };

    const saveAll = async () => {
        const invalid = ACCOUNTS.find(a => { const p = pins[a.code]||""; return p.length!==6||!/^\d{6}$/.test(p); });
        if (invalid) { setMsg({code:"ALL",text:`Invalid PIN for ${invalid.label}`,ok:false}); return; }
        setSaving("ALL");
        const updates = {};
        ACCOUNTS.forEach(a => {
            updates[`users/${a.code}`] = {code:a.code,pin:pins[a.code],role:a.role,teamId:a.teamId||null,name:a.label};
        });
        await db.ref().update(updates);
        setSaving(null);
        setMsg({code:"ALL",text:"All PINs saved",ok:true});
        setTimeout(() => setMsg(null), 2000);
    };

    return (
        <div className="card" style={{marginTop:16}}>
            <div className="card-title">Manage PINs</div>
            <div className="card-sub">Set or update 6-digit PINs for each account. Changes take effect immediately.</div>
            <div style={{maxHeight:320,overflowY:"auto",marginTop:10}}>
                {ACCOUNTS.map(a => (
                    <div key={a.code} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <div style={{flex:1,fontSize:12,color:"#ccc",minWidth:160}}>{a.label}</div>
                        <input
                            type="password"
                            maxLength={6}
                            inputMode="numeric"
                            placeholder="● ● ● ● ● ●"
                            value={pins[a.code]||""}
                            style={{width:110,letterSpacing:4,textAlign:"center",padding:"6px 8px",background:"#1a1f2e",border:"1px solid #333",borderRadius:6,color:"#fff",fontSize:14}}
                            onChange={e => setPins(p => ({...p,[a.code]:e.target.value.replace(/\D/g,"").slice(0,6)}))}
                        />
                        <button
                            className="btn btn-neutral"
                            style={{width:"auto",padding:"6px 12px",fontSize:12}}
                            onClick={() => save(a)}
                            disabled={saving===a.code||saving==="ALL"}
                        >{saving===a.code?"…":"Save"}</button>
                        {msg && msg.code===a.code && <span style={{fontSize:11,color:msg.ok?"#4caf50":"#f44"}}>{msg.text}</span>}
                    </div>
                ))}
            </div>
            <button className="btn btn-primary" style={{marginTop:12}} onClick={saveAll} disabled={!!saving}>
                {saving==="ALL" ? "Saving all…" : "Save All PINs"}
            </button>
            {msg && msg.code==="ALL" && <div style={{marginTop:6,fontSize:12,color:msg.ok?"#4caf50":"#f44"}}>{msg.text}</div>}
        </div>
    );
}

function Auction({ sid, user, onBack }) {
    const [state, setState] = useState(null);
    const [connected, setConnected] = useState(false);
    const [timeLeft, setTimeLeft] = useState(60);
    const [bidInputs, setBidInputs] = useState({});
    const [bidErrors, setBidErrors] = useState({});
    const [actionError, setActionError] = useState(null);
    const [resetOpen, setResetOpen] = useState(false);
    const [showRosters, setShowRosters] = useState(() => pref("ta_rosters",true));
    const [pinnedTeam, setPinnedTeam] = useState(() => pref("ta_pin",null));
    const auctionRef = useRef(db.ref(`auctions/${sid}`));

    // Real-time listener
    useEffect(() => {
        const connRef = db.ref(".info/connected");
        connRef.on("value", s => setConnected(s.val()===true));
        auctionRef.current.on("value", snap => {
            if (snap.exists()) { setState(normalize(snap.val())); setConnected(true); }
            else setConnected(false);
        });
        return () => { connRef.off(); auctionRef.current.off(); };
    }, [sid]);

    // Timer
    useEffect(() => {
        if (!state?.timerEnd) return;
        const iv = setInterval(() => setTimeLeft(Math.max(0, Math.floor((state.timerEnd - Date.now())/1000))), 200);
        return () => clearInterval(iv);
    }, [state?.timerEnd]);

    const fbUpdate = updates => auctionRef.current.update({...updates, lastUpdate: Date.now()});
    const toggleRosters = () => { const n=!showRosters; setShowRosters(n); savePref("ta_rosters",n); };
    const togglePin = id => { const n=pinnedTeam===id?null:id; setPinnedTeam(n); savePref("ta_pin",n); };

    const placeBid = (teamId, amount) => {
        const n = parseInt(amount)||0;
        if (!eff?.player) return;
        const err = validateBid(teamId, n);
        if (err) { setBidErrors(p=>({...p,[teamId]:err})); return; }
        if (timeLeft===0) { setBidErrors(p=>({...p,[teamId]:"Time is up!"})); return; }
        setBidErrors(p=>({...p,[teamId]:null}));
        auctionRef.current.child("currentBids").transaction(cur => {
            const bids = cur||{};
            const taken = Object.entries(bids).some(([tid,b])=>parseInt(tid)!==teamId && b===n);
            if (taken) return; // abort
            return {...bids,[teamId]:n};
        }, (err,committed) => {
            if (!committed) setBidErrors(p=>({...p,[teamId]:"Amount taken — bid higher"}));
            else { setBidInputs(p=>({...p,[teamId]:""})); auctionRef.current.update({lastUpdate:Date.now()}); }
        });
    };

    const validateBid = (teamId, amount) => {
        if (!eff?.player) return "No player";
        const team = state.teams.find(t=>t.id===teamId);
        if (!team) return "Team not found";
        if (team.players.length >= TEAM_SIZE) return `Team full`;
        const utr = getUTR(eff.poolKey);
        const fromPool = team.players.slice(1).filter(p=>p.utr===utr).length;
        if (fromPool >= (POOL_CAPS[eff.poolKey]||0)) return `Max ${POOL_CAPS[eff.poolKey]} at UTR ${utr}`;
        if (!amount||amount<=0) return "Enter amount";
        if (amount < eff.player.price) return `Min $${fmt(eff.player.price)}`;
        if ((amount - eff.player.price)%1000!==0) return "Base + $1k increments";
        const dup = state.teams.find(t=>t.id!==teamId&&(state.currentBids[String(t.id)]||0)===amount);
        if (dup) return `$${fmt(amount)} taken by ${dup.name}`;
        if (amount > team.budget) return "Exceeds budget";
        const rem = TEAM_SIZE - team.players.length;
        const minNeeded = rem>1?(rem-1)*5000:0;
        if (amount > team.budget-minNeeded) return `Need $${fmt(minNeeded)} for ${rem-1} more`;
        return null;
    };

    const finalize = () => {
        if (!eff?.player) return;
        const bids = Object.entries(state.currentBids).map(([tid,b])=>({teamId:parseInt(tid),bid:b})).filter(x=>x.bid>0);
        if (!bids.length) { setActionError("No bids — use Skip"); return; }
        const highest = Math.max(...bids.map(b=>b.bid));
        const winners = bids.filter(b=>b.bid===highest);
        if (winners.length>1) { setActionError(`Tie between ${winners.map(w=>state.teams.find(t=>t.id===w.teamId)?.name).join(", ")} — place different bids`); return; }
        const winId = winners[0].teamId;
        const teams = state.teams.map(t => {
            if (t.id!==winId) return t;
            return {...t, players:[...t.players,{...eff.player,acquiredPrice:highest}], budget:t.budget-highest, totalSpent:t.totalSpent+highest};
        });
        const pools = {...state.playerPools};
        const pool = [...pools[eff.poolKey]];
        pool.splice(eff.effPlayer,1);
        pools[eff.poolKey] = pool;
        let nextPool=eff.effPool, nextPlayer=eff.effPlayer;
        if (eff.effPlayer>=pool.length) { nextPool=eff.effPool+1; nextPlayer=0; }
        fbUpdate({teams,playerPools:pools,currentPoolIndex:nextPool,currentPlayerIndex:nextPlayer,currentBids:{},timerEnd:Date.now()+TIMER_MS});
        setBidInputs({}); setBidErrors({}); setActionError(null);
    };

    const skip = () => {
        if (!eff?.player) return;
        const pools = {...state.playerPools};
        const pool = [...pools[eff.poolKey]];
        const moved = {...pool[eff.effPlayer],isRetry:true,retryCount:(pool[eff.effPlayer].retryCount||0)+1};
        pool.splice(eff.effPlayer,1); pool.push(moved);
        pools[eff.poolKey] = pool;
        let nextPool=eff.effPool, nextPlayer=eff.effPlayer;
        if (eff.effPlayer>=pool.length) { nextPool=eff.effPool+1; nextPlayer=0; }
        fbUpdate({playerPools:pools,currentPoolIndex:nextPool,currentPlayerIndex:nextPlayer,currentBids:{},timerEnd:Date.now()+TIMER_MS});
        setBidInputs({}); setBidErrors({}); setActionError(null);
    };

    const reset = () => {
        auctionRef.current.set(initialDoc(sid));
        setBidInputs({}); setBidErrors({}); setActionError(null); setResetOpen(false);
    };

    if (!state) return <div style={{textAlign:"center",padding:40,color:"#888"}}>Loading auction {sid}…</div>;

    const eff = getEffective(state);
    const isAdmin = user.role === "admin";
    const myTeamId = user.teamId;

    // Auction complete
    if (eff.complete || !eff.player) {
        return (
            <div>
                <div className="top-bar">
                    <h1>🎾 TENNIS AUCTION</h1>
                    <div className="sync-dot"><div className={`dot ${connected?"dot-green":"dot-red"}`}/>{connected?"Live":"Offline"}</div>
                </div>
                <div className="complete-banner">🏆 Auction Complete · Session {sid}</div>
                {isAdmin && <div style={{textAlign:"center",marginBottom:12}}>
                    <button className="btn btn-danger" style={{width:"auto",padding:"10px 24px"}} onClick={()=>setResetOpen(true)}>Reset Auction</button>
                </div>}
                <div className="rosters-grid">
                    {state.teams.map(t => <RosterCard key={t.id} team={t}/>)}
                </div>
                {resetOpen && <ResetModal onCancel={()=>setResetOpen(false)} onConfirm={reset}/>}
            </div>
        );
    }

    const bids = Object.entries(state.currentBids).map(([tid,b])=>({teamId:parseInt(tid),bid:b})).filter(x=>x.bid>0);
    const highest = bids.length ? Math.max(...bids.map(b=>b.bid)) : 0;
    const winners = bids.filter(b=>b.bid===highest);
    const hasBids = bids.length>0;
    const warn = timeLeft<=10;
    const pct = Math.min(100,Math.round(((eff.effPool+(eff.effPlayer/Math.max(1,eff.pool.length)))/POOL_ORDER.length)*100));

    const teamStatusFor = team => {
        const teamBid = state.currentBids[String(team.id)]||0;
        const isWin = teamBid>0&&teamBid===highest&&winners.length===1;
        const isTie = teamBid>0&&teamBid===highest&&winners.length>1;
        return {teamBid,isWin,isTie};
    };

    const sortedTeams = [...state.teams].map(t => {
        const isDisabled = t.players.length>=TEAM_SIZE || t.budget<eff.player.price ||
            (t.players.slice(1).filter(p=>p.utr===getUTR(eff.poolKey)).length >= (POOL_CAPS[eff.poolKey]||0));
        return {...t,isDisabled,isPinned:pinnedTeam===t.id};
    }).sort((a,b) => {
        if (a.isPinned!==b.isPinned) return a.isPinned?-1:1;
        if (!isAdmin && a.id===myTeamId) return -1;
        if (!isAdmin && b.id===myTeamId) return 1;
        if (a.isDisabled!==b.isDisabled) return a.isDisabled?1:-1;
        return 0;
    });

    return (
        <div>
            <div className="top-bar">
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <button onClick={onBack} style={{background:"none",border:"none",color:"#888",fontSize:20,cursor:"pointer",padding:0}}>‹</button>
                    <div>
                        <div style={{fontSize:11,color:"#555",letterSpacing:1}}>SESSION</div>
                        <div style={{fontWeight:800,fontSize:20,color:"#fff",letterSpacing:2}}>{sid}</div>
                    </div>
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <div className="sync-dot"><div className={`dot ${connected?"dot-green":"dot-red"}`}/>{connected?"Live":"Offline"}</div>
                    {isAdmin && <button className="btn btn-danger" style={{width:"auto",padding:"6px 12px",fontSize:12}} onClick={()=>setResetOpen(true)}>Reset</button>}
                </div>
            </div>

            <div className="progress-track"><div className="progress-fill" style={{width:pct+"%"}}/></div>
            <div className="progress-text">UTR {getUTR(eff.poolKey)} pool · {pct}% complete · {state.teams.length} teams</div>

            <div className={`sticky-bar`} style={warn?{borderColor:"#ff6b6b"}:{}}>
                <div style={{minWidth:0}}>
                    <div className="sb-player">{eff.player.Name}{eff.player.isRetry&&<span style={{color:"#ff6b6b",fontSize:13}}> · Retry #{eff.player.retryCount}</span>}</div>
                    <div className="sb-meta">UTR {eff.player.utr} · base ${fmt(eff.player.price)} · {eff.effPlayer+1}/{eff.pool.length} in pool</div>
                    {highest>0 && <div className="sb-high">High ${fmt(highest)}{winners.length===1?" · "+state.teams.find(t=>t.id===winners[0].teamId)?.name:winners.length>1?" · TIE":""}</div>}
                </div>
                <div className={`sb-timer ${warn?"warn":""}`}>{timeLeft}s</div>
            </div>

            {actionError && <div className="error-banner" onClick={()=>setActionError(null)}>{actionError} ✕</div>}

            {isAdmin && (
                <div className="admin-bar">
                    <button className="btn btn-neutral" onClick={skip}>Skip</button>
                    <button className={`btn ${hasBids&&winners.length===1?"btn-success":"btn-neutral"}`}
                        disabled={!hasBids||winners.length!==1} onClick={finalize}>
                        {!hasBids ? "No Bids" : winners.length>1 ? `Tie (${winners.length})` : `Award → ${state.teams.find(t=>t.id===winners[0].teamId)?.name}`}
                    </button>
                </div>
            )}

            <div className="bidding-grid">
                {sortedTeams.map(team => {
                    const {teamBid,isWin,isTie} = teamStatusFor(team);
                    const isMyTeam = !isAdmin && team.id===myTeamId;

                    if (team.isDisabled && !isMyTeam) {
                        const reason = team.players.length>=TEAM_SIZE?"Full":team.budget<eff.player.price?"Low budget":`Cap at UTR ${getUTR(eff.poolKey)}`;
                        return (
                            <div key={team.id} className="bid-card disabled-card">
                                <span style={{fontSize:12,color:"#555"}}>{team.name} ({team.players.length}/{TEAM_SIZE})</span>
                                <span style={{fontSize:11,color:"#444",fontStyle:"italic"}}>{reason}</span>
                            </div>
                        );
                    }

                    const anchor = highest>0?highest+1000:eff.player.price;
                    const chips = [anchor,anchor+1000,anchor+2000].filter(v=>v<=team.budget);
                    const canBid = !isAdmin || isAdmin; // admin can bid for any team in test mode — captains only their own

                    return (
                        <div key={team.id} className={`bid-card ${isWin?"winning":""} ${isTie?"tied":""} ${team.isPinned?"pinned":""}`}>
                            <div className="bid-card-head">
                                <div>
                                    <div className="team-name">{team.name}{isMyTeam?" · You":""}</div>
                                    <div className="team-meta">{team.captain} · ${fmt(team.budget)} · {team.players.length}/{TEAM_SIZE}</div>
                                </div>
                                <button className={`pin-btn ${team.isPinned?"pinned":""}`} onClick={()=>togglePin(team.id)} title="Pin my team">📌</button>
                            </div>

                            {(isAdmin || isMyTeam) && (
                                <div className="bid-input-wrap">
                                    <input type="number" inputMode="numeric" className="bid-input"
                                        placeholder={`Min $${fmt(eff.player.price)}`}
                                        value={bidInputs[team.id]||""}
                                        disabled={timeLeft===0}
                                        onChange={e=>{setBidInputs(p=>({...p,[team.id]:e.target.value}));setBidErrors(p=>({...p,[team.id]:null}));}}
                                        onKeyPress={e=>e.key==="Enter"&&bidInputs[team.id]&&placeBid(team.id,bidInputs[team.id])}
                                    />
                                    <div className="quick-chips">
                                        {chips.map(v=><button key={v} className="chip" disabled={timeLeft===0} onClick={()=>{setBidInputs(p=>({...p,[team.id]:String(v)}));setBidErrors(p=>({...p,[team.id]:null}));}}>
                                            ${v/1000}k
                                        </button>)}
                                    </div>
                                    {bidErrors[team.id] && <div className="bid-error">{bidErrors[team.id]}</div>}
                                    <button className="btn btn-primary place-bid-btn"
                                        disabled={!bidInputs[team.id]||timeLeft===0}
                                        onClick={()=>placeBid(team.id,bidInputs[team.id])}>
                                        Place Bid
                                    </button>
                                </div>
                            )}

                            {teamBid>0 && <div className="bid-status">Bid: ${fmt(teamBid)}</div>}
                            {isWin && <span className="bid-win-badge">WINNING</span>}
                            {isTie && <span className="bid-tie-badge">TIED</span>}
                        </div>
                    );
                })}
            </div>

            <div className="pool-viewer">
                <div style={{fontSize:12,fontWeight:700,color:"#888",marginBottom:4}}>Current pool · UTR {getUTR(eff.poolKey)}</div>
                <div className="pool-grid">
                    {eff.pool.map((p,i)=>(
                        <div key={p.id||i} className={`pool-chip ${i===eff.effPlayer?"active":""} ${p.isRetry?"retry":""}`} title={p.Name}>
                            {i===eff.effPlayer?"▶ ":""}{p.Name.length>18?p.Name.slice(0,16)+"…":p.Name}
                            {p.isRetry&&` (R${p.retryCount})`}
                        </div>
                    ))}
                </div>
            </div>

            <button className="section-toggle" onClick={toggleRosters}>
                <span>Team rosters · {state.teams.length} teams</span>
                <span>{showRosters?"Hide ▲":"Show ▼"}</span>
            </button>
            {showRosters && (
                <div className="rosters-grid">
                    {state.teams.map(t=><RosterCard key={t.id} team={t}/>)}
                </div>
            )}

            {resetOpen && <ResetModal onCancel={()=>setResetOpen(false)} onConfirm={reset}/>}
        </div>
    );
}

function RosterCard({team}) {
    const cap = team.players[0];
    const rest = team.players.slice(1);
    return (
        <div className="roster-card">
            <div className="roster-name">{team.name} ({team.players.length}/{TEAM_SIZE})</div>
            <div className="roster-budget">
                <span className="roster-spent">-${fmt(team.totalSpent)}</span>
                <span className="roster-left">${fmt(team.budget)} left</span>
            </div>
            {cap && <div className="roster-player roster-captain">⭐ {cap.Name} ({cap.utr})</div>}
            {rest.map(p=><div key={p.id} className="roster-player">{p.Name} · ${fmt(p.acquiredPrice)}</div>)}
        </div>
    );
}

function ResetModal({onCancel,onConfirm}) {
    return (
        <div className="modal-overlay">
            <div className="modal-card">
                <div className="modal-title">Reset auction?</div>
                <div className="modal-body">Clears all bids and rosters. This cannot be undone.</div>
                <div className="modal-btns">
                    <button className="btn btn-neutral" onClick={onCancel}>Cancel</button>
                    <button className="btn btn-danger" onClick={onConfirm}>Reset</button>
                </div>
            </div>
        </div>
    );
}

// ─── Root app ─────────────────────────────────────────────────────────────────
function App() {
    const [user, setUser] = useState(() => pref("ta_user", null));
    const [sessionId, setSessionId] = useState(null);

    const handleLogin = u => { setUser(u); savePref("ta_user",u); };
    const handleLogout = () => { setUser(null); savePref("ta_user",null); setSessionId(null); };

    if (!user) return <Login onLogin={handleLogin}/>;
    if (!sessionId) return <Lobby user={user} onJoin={setSessionId} onLogout={handleLogout}/>;
    return <Auction sid={sessionId} user={user} onBack={()=>setSessionId(null)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
